name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - name: Install CI workflow verifier dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify CI workflow contract
        run: python infra/scripts/verify-ci-workflow.py
      - name: Run CI workflow negative checks
        run: python infra/scripts/verify-ci-workflow-test.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Docker daemon for Testcontainers
        run: docker info
      - name: Run API tests
        working-directory: apps/api
        run: ./mvnw test

  web:
    name: Web tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run web tests
        working-directory: apps/web
        run: npm test -- --run
      - name: Build web
        working-directory: apps/web
        run: npm run build

  admin:
    name: Admin tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Run admin tests
        working-directory: apps/admin
        run: npm test -- --run
      - name: Build and type-check admin
        working-directory: apps/admin
        run: npm run build
