events {}
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream preview_web { zone preview_web 64k; server yongtuo-phase5-web-1:3000 resolve; }
  upstream preview_api { zone preview_api 64k; server yongtuo-phase5-api-1:8080 resolve; }
  upstream preview_admin { zone preview_admin 64k; server yongtuo-phase5-admin-1:80 resolve; }
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /manage { return 308 /manage/; }
    location ^~ /manage/ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://preview_admin/;
    }
    # Authentication and authorization remain enforced by the existing API.
    location ^~ /api/v1/admin/ {
      client_max_body_size 210m;
      proxy_read_timeout 120s;
      proxy_pass http://preview_api;
    }
    location ^~ /api/v1/public/ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://preview_api;
    }
    location ~* ^/(manage|api|actuator|swagger|v3/api-docs)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://preview_web;
    }
  }
}
