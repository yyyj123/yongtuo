events {}

http {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Docker's embedded DNS tracks container IP changes. The shared-memory
    # upstream zones let Nginx refresh those addresses without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    upstream web_upstream {
        zone web_upstream 64k;
        server web:3000 resolve;
    }

    upstream admin_upstream {
        zone admin_upstream 64k;
        server admin:80 resolve;
    }

    upstream api_upstream {
        zone api_upstream 64k;
        server api:8080 resolve;
    }

    server {
        listen 80;
        server_name _;

        location = /manage {
            return 308 /manage/;
        }

        # Keep static assets on their explicit public prefix. The admin Nginx
        # has a matching /assets/ no-fallback rule for deterministic 404s.
        location /manage/assets/ {
            proxy_pass http://admin_upstream/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The proxy removes /manage/ before forwarding. The admin build uses
        # Vite's /manage/ base, so its asset URLs return through this location.
        location /manage/ {
            proxy_pass http://admin_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # No trailing slash on proxy_pass preserves the /api/ prefix required
        # by Spring Boot's /api/v1/public/site-health contract.
        location /api/ {
            client_max_body_size 210m;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
