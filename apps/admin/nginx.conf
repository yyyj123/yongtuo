server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The outer proxy strips /manage/, so public /manage/assets/* requests
    # arrive here as /assets/*. Static misses must not fall through to the SPA.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
